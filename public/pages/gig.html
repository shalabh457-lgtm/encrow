<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gig Details | Trust+</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header id="navbar" class="navbar navbar-page">
      <div class="contain">
        <div class="navbar-inner">
          <a href="../index.html" class="navbar-logo">
            <span>Trust+</span><span class="dot">.</span>
          </a>
          <nav class="nav-links" id="nav-links"></nav>
        </div>
      </div>
    </header>

    <main class="page-wrapper pb-40">
      <div class="contain">
          <div class="gig-page">

            <div class="gig-details">
              <div class="gig-breadcrumb">
                <span class="gig-cat">FIVERR </span>
                <span>
                  <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M10.293 3.293L17 10l-6.707 6.707-1.414-1.414L14.172 10 8.879 4.707l1.414-1.414z"></path></svg>
                </span>
                <span id="gig-category" class="gig-cat">Loading...</span>
              </div>

              <h1 id="gig-title">Loading Gig Title...</h1>

              <div class="gig-seller-top">
                <a href="#" id="seller-link-top">
                  <img id="seller-avatar-top" src="https://i.pravatar.cc/150" alt="Avatar" />
                  <span id="seller-name-top">Loading...</span>
                </a>
                <div class="rating">
                  <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z"></path></svg>
                  <span id="gig-rating">5.0</span>
                </div>
              </div>

              <div class="gig-main-image">
                <img id="gig-image" src="" alt="Gig Image">
              </div>

              <h2>About This Gig</h2>
              <p id="gig-desc" class="gig-about-text">Loading description...</p>

              <hr class="gig-divider">

              <h2>About The Seller</h2>
              <div class="gig-about-seller">
                <a href="#" id="seller-link-bottom">
                  <img id="seller-avatar-bottom" src="https://i.pravatar.cc/150" alt="Avatar" />
                </a>
                <div class="gig-about-seller-info">
                  <a href="#" id="seller-name-link-bottom">
                    <h4 id="seller-name-bottom">Seller Name</h4>
                  </a>
                  <button class="btn-outline">Contact Me</button>
                </div>
              </div>
            </div>

            <div class="gig-sidebar">
              <div class="order-card">
                <div class="order-card-header">
                  <h2>Basic Package</h2>
                  <h2 id="gig-price" class="price">₹0</h2>
                </div>

                <p id="gig-short-desc" class="order-card-desc">Loading short description...</p>

                <div class="order-card-meta">
                  <div>
                    <svg class="order-meta-icon" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="18" width="18" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span id="gig-delivery">3 Days Delivery</span>
                  </div>
                  <div>
                    <svg class="order-meta-icon" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="18" width="18" xmlns="http://www.w3.org/2000/svg"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                    <span id="gig-revisions">Unlimited Revisions</span>
                  </div>
                </div>

                <button class="btn-continue">Continue</button>
                <button class="btn-compare">Compare Packages</button>
              </div>
            </div>

          </div>
      </div>
    </main>

    <script src="../js/storage.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/gig.js"></script>
</body>
</html>
