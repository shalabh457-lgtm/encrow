<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust+ - Sign In</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h2>Sign In to Trust+</h2>

        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" placeholder="Johndoe" class="form-input" required />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" placeholder="********" class="form-input" required />
            </div>

            <p id="error-msg" class="error-text hidden"></p>

            <button type="submit" id="submit-btn" class="btn-submit">
                Login
            </button>
        </form>

        <div class="auth-footer">
            Not a member yet?
            <a href="register.html">Join now</a>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.innerText = 'Loading...';
            errorMsg.classList.add('hidden');

            await StorageManager.mockDelay(1000); // Simulate network request

            const users = StorageManager.get('users') || [];
            const user = users.find(u => u.username === username && u.password === password);

            if (!user) {
                errorMsg.innerText = 'Invalid username or password';
                errorMsg.classList.remove('hidden');
                btn.innerText = 'Login';
                return;
            }

            StorageManager.setCurrentUser(user);
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
